<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tan làm 17h30</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1f2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", sans-serif; }
.widget { background: linear-gradient(135deg, #2a3245 0%, #1e2840 100%); border-radius: 24px; padding: 22px 24px; width: 100vw; max-width: 360px; position: relative; overflow: hidden; }
.widget::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(100deg, transparent, transparent 18px, rgba(100,140,200,0.04) 18px, rgba(100,140,200,0.04) 19px); pointer-events: none; }
.card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 18px 20px; display: flex; align-items: center; gap: 16px; transition: background 0.3s; }
.card.active { background: rgba(120,160,255,0.1); border-color: rgba(120,160,255,0.2); }
.card.done { background: rgba(100,220,160,0.08); border-color: rgba(100,220,160,0.2); }
.icon { width: 52px; height: 52px; flex-shrink: 0; }
.info { flex: 1; }
.label { font-size: 11px; color: #6b7fa8; letter-spacing: 0.08em; margin-bottom: 3px; }
.target-time { font-size: 13px; color: #8fa0c8; font-weight: 500; margin-bottom: 6px; }
.countdown { font-size: 32px; font-weight: 700; color: #e0e8ff; letter-spacing: 0.02em; line-height: 1; }
.countdown.urgent { color: #ff9a7a; animation: pulse 1s ease-in-out infinite; }
.countdown.done-text { font-size: 15px; color: #6ddfaa; line-height: 1.4; }
.sub { font-size: 11px; color: #5a6a90; margin-top: 5px; }
.now-time { text-align: center; font-size: 11px; color: #4a5878; margin-top: 12px; letter-spacing: 0.1em; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.icon svg { animation: float 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="widget">
  <div class="card" id="card">
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="24" cy="22" rx="14" ry="10" fill="#2a3a5a"/>
        <ellipse cx="20" cy="21" rx="2" ry="1.5" fill="#1a2a4a"/>
        <ellipse cx="28" cy="21" rx="2" ry="1.5" fill="#1a2a4a"/>
        <path d="M20 25 Q24 28 28 25" stroke="#8aafcc" stroke-width="1.5" stroke-linecap="round" fill="none"/>
        <ellipse cx="12" cy="17" rx="3" ry="4" fill="#2a3a5a"/>
        <ellipse cx="36" cy="17" rx="3" ry="4" fill="#2a3a5a"/>
        <text x="30" y="14" font-size="6" fill="#7a9acc" font-family="serif" font-weight="bold">z</text>
        <text x="34" y="10" font-size="5" fill="#5a7aaa" font-family="serif" font-weight="bold">z</text>
        <text x="37" y="7" font-size="4" fill="#3a5a8a" font-family="serif" font-weight="bold">z</text>
        <path d="M36 28 Q42 30 40 34 Q38 38 34 36" stroke="#2a3a5a" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div class="info">
      <div class="label">sắp được tự do rồi đó! 🕊️</div>
      <div class="target-time">🏠 17:30 — tan làm</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="now-time" id="now-time"></div>
</div>
<script>
function pad(n) { return String(n).padStart(2, "0"); }
function getTargetMs(h, m) {
  const now = new Date(), t = new Date(now);
  t.setHours(h, m, 0, 0);
  if (t <= now) t.setDate(t.getDate() + 1);
  return t - now;
}
function update() {
  const now = new Date();
  document.getElementById("now-time").textContent = pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  const ms = getTargetMs(17, 30);
  const cd = document.getElementById("countdown");
  const card = document.getElementById("card");
  const sub = document.getElementById("sub");
  if (ms <= 0) {
    cd.textContent = "Tan làm, đi dìa hoy chế yêu! 🏃💨"; cd.className = "countdown done-text"; card.className = "card done"; sub.textContent = "";
  } else {
    const total = Math.floor(ms/1000), h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
    cd.textContent = pad(h)+":"+pad(m)+":"+pad(s);
    const mins = Math.floor(ms/60000);
    card.className = mins <= 10 ? "card active" : "card";
    cd.className = mins <= 5 ? "countdown urgent" : "countdown";
    sub.textContent = mins <= 5 ? "Sắp rồi sắp rồi, chuẩn bị đồ đạc đi! 🎒" : mins < 60 ? "còn "+mins+" phút nữa thôi!" : "còn "+Math.floor(mins/60)+" tiếng "+mins%60+" phút, cố lên nha! 💪";
  }
}
update(); setInterval(update, 1000);
</script>
</body>
</html>
