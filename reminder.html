<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhắc việc 🌸</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f1117;
    min-height: 100vh;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 420px;
  }

  /* HEADER */
  .header {
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header h1 {
    font-size: 18px;
    font-weight: 700;
    color: #f0eaff;
    letter-spacing: -0.02em;
  }

  .now {
    font-size: 12px;
    color: #5a5a7a;
    letter-spacing: 0.05em;
  }

  /* ADD FORM */
  .add-box {
    background: #1a1a2e;
    border: 1px solid #2a2a45;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 20px;
  }

  .add-box input[type="text"] {
    width: 100%;
    background: #0f1117;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 12px 14px;
    color: #e0d8ff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 10px;
    transition: border 0.2s;
  }

  .add-box input[type="text"]:focus {
    border-color: #7c6aff;
  }

  .add-box input[type="text"]::placeholder { color: #3a3a5a; }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
  }

  .add-box input[type="time"] {
    flex: 1;
    background: #0f1117;
    border: 1px solid #2a2a45;
    border-radius: 12px;
    padding: 10px 12px;
    color: #e0d8ff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border 0.2s;
  }

  .add-box input[type="time"]:focus { border-color: #7c6aff; }

  .type-toggle {
    display: flex;
    gap: 6px;
  }

  .type-btn {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid #2a2a45;
    background: #0f1117;
    color: #5a5a7a;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .type-btn.active {
    background: #7c6aff22;
    border-color: #7c6aff;
    color: #a99aff;
  }

  .add-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #7c6aff, #b06aff);
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .add-btn:hover { opacity: 0.85; }

  /* REMINDERS LIST */
  .section-label {
    font-size: 11px;
    color: #4a4a6a;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .reminders {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .reminder-card {
    background: #1a1a2e;
    border: 1px solid #2a2a45;
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }

  .reminder-card.ringing {
    border-color: #ff9a7a;
    background: #2a1a1a;
    animation: ring-pulse 0.5s ease-in-out infinite alternate;
  }

  .reminder-card.done {
    opacity: 0.4;
  }

  @keyframes ring-pulse {
    from { box-shadow: 0 0 0 0 rgba(255,154,122,0.3); }
    to { box-shadow: 0 0 0 8px rgba(255,154,122,0); }
  }

  .reminder-icon {
    font-size: 22px;
    flex-shrink: 0;
    width: 36px;
    text-align: center;
  }

  .reminder-info { flex: 1; }

  .reminder-title {
    font-size: 14px;
    font-weight: 600;
    color: #e0d8ff;
    margin-bottom: 3px;
  }

  .reminder-meta {
    font-size: 11px;
    color: #5a5a7a;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .badge {
    background: #2a2a45;
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 10px;
    color: #7c6aff;
  }

  .badge.daily { color: #6ddfaa; background: #1a2a2a; }

  .time-left {
    font-size: 12px;
    font-weight: 700;
    color: #7c6aff;
    flex-shrink: 0;
    text-align: right;
    min-width: 50px;
  }

  .time-left.soon { color: #ff9a7a; }
  .time-left.ringing-text { color: #ff9a7a; animation: pulse 0.6s ease-in-out infinite alternate; }

  .delete-btn {
    background: none;
    border: none;
    color: #3a3a5a;
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: #ff6a6a; }

  /* POPUP */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .popup-overlay.show { display: flex; }

  .popup {
    background: #1a1a2e;
    border: 1px solid #7c6aff44;
    border-radius: 24px;
    padding: 32px 28px;
    max-width: 320px;
    width: 90%;
    text-align: center;
    animation: popup-in 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popup-in {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .popup-emoji { font-size: 48px; margin-bottom: 12px; }
  .popup-title { font-size: 11px; color: #7c6aff; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .popup-task { font-size: 20px; font-weight: 700; color: #f0eaff; margin-bottom: 6px; line-height: 1.3; }
  .popup-time { font-size: 13px; color: #5a5a7a; margin-bottom: 24px; }

  .popup-dismiss {
    background: linear-gradient(135deg, #7c6aff, #b06aff);
    border: none;
    border-radius: 12px;
    padding: 12px 32px;
    color: white;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    width: 100%;
  }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 32px;
    color: #3a3a5a;
    font-size: 13px;
  }

  .empty .empty-icon { font-size: 32px; margin-bottom: 8px; }

  @keyframes pulse {
    from { opacity: 1; }
    to { opacity: 0.5; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🌸 Nhắc việc</h1>
    <div class="now" id="now-time"></div>
  </div>

  <!-- ADD FORM -->
  <div class="add-box">
    <input type="text" id="task-input" placeholder="Việc cần nhắc... ví dụ: Uống nước 💧" maxlength="60">
    <div class="row">
      <div style="display:flex;align-items:center;gap:4px;flex:1;background:#0f1117;border:1px solid #2a2a45;border-radius:12px;padding:10px 12px;">
        <input type="number" id="hour-input" min="0" max="23" placeholder="GIỜ" style="width:52px;background:none;border:none;color:#e0d8ff;font-size:15px;font-family:inherit;outline:none;text-align:center;" >
        <span style="color:#5a5a7a;font-size:18px;font-weight:700">:</span>
        <input type="number" id="min-input" min="0" max="59" placeholder="PHÚT" style="width:52px;background:none;border:none;color:#e0d8ff;font-size:15px;font-family:inherit;outline:none;text-align:center;">
      </div>
      <div class="type-toggle">
        <button class="type-btn active" id="btn-once" onclick="setType('once')">1 lần</button>
        <button class="type-btn" id="btn-daily" onclick="setType('daily')">Hằng ngày</button>
      </div>
    </div>
    <button class="add-btn" onclick="addReminder()">+ Thêm nhắc việc</button>
  </div>

  <!-- LIST -->
  <div class="section-label">Danh sách nhắc việc</div>
  <div class="reminders" id="reminders-list">
    <div class="empty"><div class="empty-icon">📭</div>Chưa có việc gì nha chế!</div>
  </div>
</div>

<!-- POPUP -->
<div class="popup-overlay" id="popup">
  <div class="popup">
    <div class="popup-emoji">🔔</div>
    <div class="popup-title">Đến giờ rồi!</div>
    <div class="popup-task" id="popup-task"></div>
    <div class="popup-time" id="popup-time"></div>
    <button class="popup-dismiss" onclick="dismissPopup()">Okie bé ơi! ✨</button>
  </div>
</div>

<audio id="ding" preload="auto">
  <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA..." type="audio/wav">
</audio>

<script>
let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');
let selectedType = 'once';
let activePopup = null;
let checked = {};

const EMOJIS = ['🌸','⭐','💜','🎯','💡','🌿','🔥','💎','🎀','🍵'];

function setType(type) {
  selectedType = type;
  document.getElementById('btn-once').classList.toggle('active', type === 'once');
  document.getElementById('btn-daily').classList.toggle('active', type === 'daily');
}

function addReminder() {
  const task = document.getElementById('task-input').value.trim();
  const h = document.getElementById('hour-input').value;
  const m = document.getElementById('min-input').value;
  if (!task || h === '' || m === '') { alert('Chế điền tên việc và giờ nha! 😊'); return; }
  const time = pad(parseInt(h)) + ':' + pad(parseInt(m));
  
  const emoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
  reminders.push({ id: Date.now(), task, time, type: selectedType, emoji, done: false });
  save();
  render();
  document.getElementById('task-input').value = '';
  document.getElementById('hour-input').value = '';
  document.getElementById('min-input').value = '';
}

function deleteReminder(id) {
  reminders = reminders.filter(r => r.id !== id);
  save();
  render();
}

function save() {
  localStorage.setItem('reminders', JSON.stringify(reminders));
}

function getTimeLeft(timeStr) {
  const now = new Date();
  const [h, m] = timeStr.split(':').map(Number);
  const target = new Date(now);
  target.setHours(h, m, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const diff = target - now;
  const totalMins = Math.floor(diff / 60000);
  if (totalMins < 1) return { text: '🔔 Ngay bây giờ!', soon: true, ringing: true, ms: diff };
  if (totalMins < 60) return { text: `${totalMins} phút`, soon: totalMins <= 10, ringing: false, ms: diff };
  const hrs = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  return { text: `${hrs}g${mins > 0 ? mins + 'p' : ''}`, soon: false, ringing: false, ms: diff };
}

function pad(n) { return String(n).padStart(2, '0'); }

function render() {
  const list = document.getElementById('reminders-list');
  if (reminders.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>Chưa có việc gì nha chế!</div>';
    return;
  }

  // Sort by time
  const sorted = [...reminders].sort((a, b) => a.time.localeCompare(b.time));

  list.innerHTML = sorted.map(r => {
    const tl = getTimeLeft(r.time);
    const isRinging = tl.ringing && !r.done;
    return `
      <div class="reminder-card ${isRinging ? 'ringing' : ''} ${r.done && r.type === 'once' ? 'done' : ''}">
        <div class="reminder-icon">${r.emoji}</div>
        <div class="reminder-info">
          <div class="reminder-title">${r.task}</div>
          <div class="reminder-meta">
            <span>${r.time}</span>
            <span class="badge ${r.type === 'daily' ? 'daily' : ''}">${r.type === 'daily' ? 'Hằng ngày' : '1 lần'}</span>
          </div>
        </div>
        <div class="time-left ${tl.soon ? 'soon' : ''} ${isRinging ? 'ringing-text' : ''}">${r.done && r.type === 'once' ? '✓' : tl.text}</div>
        <button class="delete-btn" onclick="deleteReminder(${r.id})">✕</button>
      </div>
    `;
  }).join('');
}

function showPopup(reminder) {
  if (activePopup === reminder.id) return;
  activePopup = reminder.id;
  document.getElementById('popup-task').textContent = reminder.emoji + ' ' + reminder.task;
  document.getElementById('popup-time').textContent = '⏰ ' + reminder.time;
  document.getElementById('popup').classList.add('show');

  // Play beep using Web Audio API
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.2);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  } catch(e) {}
}

function dismissPopup() {
  document.getElementById('popup').classList.remove('show');
  // Mark once reminders as done
  if (activePopup) {
    reminders = reminders.map(r => r.id === activePopup && r.type === 'once' ? {...r, done: true} : r);
    save();
  }
  activePopup = null;
  render();
}

function checkReminders() {
  const now = new Date();
  const currentTime = pad(now.getHours()) + ':' + pad(now.getMinutes());
  
  reminders.forEach(r => {
    if (r.done && r.type === 'once') return;
    if (r.time === currentTime) {
      const key = r.id + '-' + currentTime;
      if (!checked[key]) {
        checked[key] = true;
        showPopup(r);
        // Reset daily reminders for next day
        if (r.type === 'daily') {
          setTimeout(() => { delete checked[key]; }, 61000);
        }
      }
    }
  });
}

function updateClock() {
  const now = new Date();
  document.getElementById('now-time').textContent = 
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}



render();
updateClock();
setInterval(() => { updateClock(); checkReminders(); render(); }, 1000);
</script>
</body>
</html>
