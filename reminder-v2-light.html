<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhắc việc ✨</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { background:linear-gradient(135deg,#fce4ec,#f3e5f5,#e8eaf6); min-height:100vh; font-family:'Nunito',sans-serif; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; }
.app { width:100%; max-width:460px; }
.header { margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:20px; font-weight:800; color:#5c3d7a; }
.now { font-size:12px; color:#b39ddb; font-weight:600; }

.add-box { background:white; border-radius:24px; padding:20px; margin-bottom:20px; box-shadow:0 4px 20px rgba(156,39,176,.1); }
.field { margin-bottom:12px; }
.field label { font-size:11px; color:#b39ddb; font-weight:700; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:5px; }
input[type=text], input[type=number], input[type=date], select {
  width:100%; background:#fafafa; border:1.5px solid #e1bee7; border-radius:12px;
  padding:11px 14px; color:#4a235a; font-size:14px; font-family:inherit; outline:none; transition:border .2s; font-weight:600;
}
input:focus, select:focus { border-color:#ab47bc; background:white; }
input::placeholder { color:#ce93d8; font-weight:400; }
select option { background:white; }

.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; }
.time-row { display:flex; gap:6px; align-items:center; }
.time-row input[type=number] { text-align:center; }
.time-sep { color:#ce93d8; font-size:20px; font-weight:800; flex-shrink:0; }

.repeat-row { display:flex; gap:8px; align-items:center; }
.repeat-row input[type=number] { width:80px; flex:none; }
.repeat-row select { flex:1; }

.add-btn { width:100%; padding:13px; background:linear-gradient(135deg,#ab47bc,#7b1fa2); border:none; border-radius:14px; color:white; font-size:14px; font-weight:800; font-family:inherit; cursor:pointer; transition:transform .15s; margin-top:4px; }
.add-btn:active { transform:scale(.97); }

.section-label { font-size:11px; color:#b39ddb; font-weight:700; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
.reminders { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }

.reminder-card { background:white; border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px; box-shadow:0 2px 12px rgba(156,39,176,.08); transition:all .3s; border:1.5px solid transparent; }
.reminder-card.ringing { border-color:#f06292; background:#fff0f5; animation:ring-pulse .5s ease-in-out infinite alternate; }
.reminder-card.done { opacity:.4; }
@keyframes ring-pulse { from{box-shadow:0 0 0 0 rgba(240,98,146,.3)} to{box-shadow:0 0 0 8px rgba(240,98,146,0)} }

.r-icon { font-size:24px; flex-shrink:0; width:38px; text-align:center; }
.r-info { flex:1; min-width:0; }
.r-title { font-size:14px; font-weight:700; color:#4a235a; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.r-meta { font-size:11px; color:#ce93d8; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.badge { background:#f3e5f5; border-radius:6px; padding:2px 8px; font-size:10px; color:#8e24aa; font-weight:700; white-space:nowrap; }
.badge.daily { color:#388e3c; background:#e8f5e9; }
.badge.once { color:#e65100; background:#fff3e0; }
.badge.interval { color:#1565c0; background:#e3f2fd; }

.time-left { font-size:12px; font-weight:800; color:#ab47bc; flex-shrink:0; text-align:right; min-width:50px; }
.time-left.soon { color:#f06292; }
.delete-btn { background:none; border:none; color:#e1bee7; cursor:pointer; font-size:16px; padding:4px; transition:color .2s; flex-shrink:0; }
.delete-btn:hover { color:#f06292; }

.popup-overlay { display:none; position:fixed; inset:0; background:rgba(74,35,90,.5); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(6px); }
.popup-overlay.show { display:flex; }
.popup { background:white; border-radius:28px; padding:36px 28px; max-width:320px; width:90%; text-align:center; animation:popup-in .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 20px 60px rgba(74,35,90,.2); }
@keyframes popup-in { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.popup-emoji { font-size:52px; margin-bottom:12px; }
.popup-title { font-size:11px; color:#ab47bc; letter-spacing:.1em; text-transform:uppercase; font-weight:700; margin-bottom:8px; }
.popup-task { font-size:20px; font-weight:800; color:#4a235a; margin-bottom:6px; line-height:1.3; }
.popup-time { font-size:13px; color:#ce93d8; margin-bottom:24px; }
.popup-dismiss { background:linear-gradient(135deg,#ab47bc,#7b1fa2); border:none; border-radius:14px; padding:13px 32px; color:white; font-size:14px; font-weight:800; font-family:inherit; cursor:pointer; width:100%; }

.empty { text-align:center; padding:32px; color:#ce93d8; font-size:13px; }
.empty-icon { font-size:36px; margin-bottom:8px; }
.repeat-detail { display:none; }
.repeat-detail.show { display:block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>✨ Nhắc việc</h1>
    <div class="now" id="now-time"></div>
  </div>

  <div class="add-box">
    <div class="field">
      <label>Tên việc</label>
      <input type="text" id="task-input" placeholder="Ví dụ: Uống nước 💧" maxlength="60">
    </div>
    <div class="field">
      <label>Giờ nhắc</label>
      <div class="time-row">
        <input type="number" id="hour-input" min="0" max="23" placeholder="GIỜ">
        <span class="time-sep">:</span>
        <input type="number" id="min-input" min="0" max="59" placeholder="PHÚT">
      </div>
    </div>
    <div class="field">
      <label>Kiểu nhắc</label>
      <select id="repeat-type" onchange="onRepeatChange()">
        <option value="once">1 lần duy nhất</option>
        <option value="daily">Hằng ngày</option>
        <option value="fixed">Ngày cố định</option>
        <option value="interval_hour">Lặp theo giờ</option>
        <option value="interval_day">Lặp theo ngày</option>
        <option value="monthly">Hằng tháng</option>
        <option value="yearly">Hằng năm</option>
      </select>
    </div>
    <div class="field repeat-detail" id="detail-fixed">
      <label>Chọn ngày</label>
      <input type="date" id="fixed-date">
    </div>
    <div class="field repeat-detail" id="detail-interval-hour">
      <label>Mỗi bao nhiêu tiếng?</label>
      <div class="repeat-row">
        <input type="number" id="interval-hour-val" min="1" max="23" value="2">
        <select disabled style="color:#ce93d8"><option>tiếng nhắc 1 lần</option></select>
      </div>
    </div>
    <div class="field repeat-detail" id="detail-interval-day">
      <label>Mỗi bao nhiêu ngày?</label>
      <div class="repeat-row">
        <input type="number" id="interval-day-val" min="1" value="1">
        <select disabled style="color:#ce93d8"><option>ngày nhắc 1 lần</option></select>
      </div>
    </div>
    <div class="field repeat-detail" id="detail-monthly">
      <label>Ngày trong tháng</label>
      <input type="number" id="monthly-day" min="1" max="31" placeholder="VD: 15">
    </div>
    <div class="field repeat-detail" id="detail-yearly">
      <label>Ngày & tháng trong năm</label>
      <div class="row2">
        <input type="number" id="yearly-day" min="1" max="31" placeholder="Ngày">
        <input type="number" id="yearly-month" min="1" max="12" placeholder="Tháng">
      </div>
    </div>
    <button class="add-btn" onclick="addReminder()">+ Thêm nhắc việc 🌸</button>
  </div>

  <div class="section-label">Danh sách nhắc việc</div>
  <div class="reminders" id="reminders-list">
    <div class="empty"><div class="empty-icon">🌷</div>Chưa có việc gì nha chế!</div>
  </div>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup">
    <div class="popup-emoji">🔔</div>
    <div class="popup-title">Đến giờ rồi!</div>
    <div class="popup-task" id="popup-task"></div>
    <div class="popup-time" id="popup-time"></div>
    <button class="popup-dismiss" onclick="dismissPopup()">Okie bé ơi! ✨</button>
  </div>
</div>

<script>
let reminders = JSON.parse(localStorage.getItem('reminders_v2_light') || '[]');
let activePopup = null;
let checked = {};
const EMOJIS = ['🌸','⭐','💜','🎯','💡','🌿','🔥','💎','🎀','🍵','🦋','🌙','☀️','🍀','🎵'];
function pad(n){return String(n).padStart(2,'0');}
function onRepeatChange(){
  const val=document.getElementById('repeat-type').value;
  document.querySelectorAll('.repeat-detail').forEach(el=>el.classList.remove('show'));
  const map={fixed:'detail-fixed',interval_hour:'detail-interval-hour',interval_day:'detail-interval-day',monthly:'detail-monthly',yearly:'detail-yearly'};
  if(map[val])document.getElementById(map[val]).classList.add('show');
}
function addReminder(){
  const task=document.getElementById('task-input').value.trim();
  const h=document.getElementById('hour-input').value;
  const m=document.getElementById('min-input').value;
  const type=document.getElementById('repeat-type').value;
  if(!task||h===''||m===''){alert('Chế điền tên việc và giờ nha! 😊');return;}
  const time=pad(parseInt(h))+':'+pad(parseInt(m));
  const emoji=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
  const r={id:Date.now(),task,time,type,emoji,done:false};
  if(type==='fixed'){const d=document.getElementById('fixed-date').value;if(!d){alert('Chế chọn ngày nha!');return;}r.fixedDate=d;}
  else if(type==='interval_hour')r.intervalHour=parseInt(document.getElementById('interval-hour-val').value)||2;
  else if(type==='interval_day')r.intervalDay=parseInt(document.getElementById('interval-day-val').value)||1;
  else if(type==='monthly'){const day=parseInt(document.getElementById('monthly-day').value);if(!day){alert('Chế nhập ngày trong tháng nha!');return;}r.monthlyDay=day;}
  else if(type==='yearly'){const day=parseInt(document.getElementById('yearly-day').value),month=parseInt(document.getElementById('yearly-month').value);if(!day||!month){alert('Chế nhập ngày và tháng nha!');return;}r.yearlyDay=day;r.yearlyMonth=month;}
  reminders.push(r);save();render();
  document.getElementById('task-input').value='';
  document.getElementById('hour-input').value='';
  document.getElementById('min-input').value='';
}
function deleteReminder(id){reminders=reminders.filter(r=>r.id!==id);save();render();}
function save(){localStorage.setItem('reminders_v2_light',JSON.stringify(reminders));}
function getBadge(r){
  const map={once:'1 lần',daily:'Hằng ngày',fixed:'Ngày cố định',interval_hour:`Mỗi ${r.intervalHour||2}g`,interval_day:`Mỗi ${r.intervalDay||1} ngày`,monthly:`Ngày ${r.monthlyDay} hàng tháng`,yearly:`Ngày ${r.yearlyDay}/${r.yearlyMonth} hàng năm`};
  const cls={once:'once',daily:'daily',fixed:'once',interval_hour:'interval',interval_day:'interval',monthly:'daily',yearly:'daily'};
  return `<span class="badge ${cls[r.type]||''}">${map[r.type]||r.type}</span>`;
}
function shouldFireToday(r){
  const now=new Date();
  if(r.type==='once'||r.type==='daily')return true;
  if(r.type==='fixed'){const d=new Date(r.fixedDate);return d.toDateString()===now.toDateString();}
  if(r.type==='monthly')return now.getDate()===r.monthlyDay;
  if(r.type==='yearly')return now.getDate()===r.yearlyDay&&now.getMonth()+1===r.yearlyMonth;
  if(r.type==='interval_day'){const created=new Date(r.id);const diffDays=Math.floor((now-created)/86400000);return diffDays%(r.intervalDay||1)===0;}
  return true;
}
function getTimeLeft(r){
  const now=new Date();
  if(r.type==='interval_hour'){
    const interval=(r.intervalHour||2)*3600000;
    const elapsed=(now-new Date(r.id))%interval;
    const ms=interval-elapsed;
    const mins=Math.floor(ms/60000);
    if(mins<1)return{text:'🔔 Ngay!',soon:true,ringing:true,ms};
    if(mins<60)return{text:`${mins}p`,soon:mins<=10,ringing:false,ms};
    return{text:`${Math.floor(mins/60)}g`,soon:false,ringing:false,ms};
  }
  const [h,m]=r.time.split(':').map(Number);
  const target=new Date(now);target.setHours(h,m,0,0);
  if(target<=now)target.setDate(target.getDate()+1);
  const ms=target-now;const mins=Math.floor(ms/60000);
  if(mins<1)return{text:'🔔 Ngay!',soon:true,ringing:true,ms};
  if(mins<60)return{text:`${mins}p`,soon:mins<=10,ringing:false,ms};
  return{text:`${Math.floor(mins/60)}g${mins%60>0?mins%60+'p':''}`,soon:false,ringing:false,ms};
}
function render(){
  const list=document.getElementById('reminders-list');
  if(!reminders.length){list.innerHTML='<div class="empty"><div class="empty-icon">🌷</div>Chưa có việc gì nha chế!</div>';return;}
  const sorted=[...reminders].sort((a,b)=>a.time.localeCompare(b.time));
  list.innerHTML=sorted.map(r=>{
    const tl=getTimeLeft(r);const ringing=tl.ringing&&!r.done;const isDone=r.done&&r.type==='once';
    return `<div class="reminder-card ${ringing?'ringing':''} ${isDone?'done':''}">
      <div class="r-icon">${r.emoji}</div>
      <div class="r-info"><div class="r-title">${r.task}</div><div class="r-meta">${r.time} ${getBadge(r)}</div></div>
      <div class="time-left ${tl.soon?'soon':''}">${isDone?'✓':tl.text}</div>
      <button class="delete-btn" onclick="deleteReminder(${r.id})">✕</button>
    </div>`;
  }).join('');
}
function showPopup(r){
  if(activePopup===r.id)return;activePopup=r.id;
  document.getElementById('popup-task').textContent=r.emoji+' '+r.task;
  document.getElementById('popup-time').textContent='⏰ '+r.time;
  document.getElementById('popup').classList.add('show');
  try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.15,.3].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.3,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.2);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.2);});}catch(e){}
}
function dismissPopup(){
  document.getElementById('popup').classList.remove('show');
  if(activePopup){reminders=reminders.map(r=>r.id===activePopup&&r.type==='once'?{...r,done:true}:r);save();}
  activePopup=null;render();
}
function checkReminders(){
  const now=new Date();const cur=pad(now.getHours())+':'+pad(now.getMinutes());
  reminders.forEach(r=>{
    if(r.done&&r.type==='once')return;
    let fire=false;
    if(r.type==='interval_hour'){if(getTimeLeft(r).ringing)fire=true;}
    else if(shouldFireToday(r)&&r.time===cur)fire=true;
    if(fire){const key=r.id+'-'+cur+'-'+now.toDateString();if(!checked[key]){checked[key]=true;showPopup(r);}}
  });
}
function updateClock(){const now=new Date();document.getElementById('now-time').textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());}
render();updateClock();
setInterval(()=>{updateClock();checkReminders();render();},1000);
</script>
</body>
</html>
