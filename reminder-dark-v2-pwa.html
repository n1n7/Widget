<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="description" content="Ứng dụng nhắc việc hằng ngày với notification thông minh">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nhắc Việc">
<link rel="manifest" href="/Widget/manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1117' width='192' height='192'/><text x='50%' y='50%' font-size='120' fill='%23f0eaff' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='bold'>🔔</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%230f1117' width='192' height='192' rx='44'/><text x='96' y='96' font-size='120' fill='%23f0eaff' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='bold'>🔔</text></svg>">
<title>Nhắc Việc 🌸</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f1117; min-height:100vh; font-family:'Plus Jakarta Sans',sans-serif; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; }
.app { width:100%; max-width:680px; }
.header { margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
.header h1 { font-size:18px; font-weight:700; color:#f0eaff; }
.now { font-size:12px; color:#5a5a7a; letter-spacing:.05em; }
.add-box { background:#1a1a2e; border:1px solid #2a2a45; border-radius:20px; padding:18px; margin-bottom:20px; position:relative; }
.add-box.editing { border-color:#7c6aff; }
.form-title { font-size:13px; font-weight:600; color:#7c6aff; margin-bottom:12px; }
.field { margin-bottom:10px; }
.field label { font-size:11px; color:#5a5a7a; letter-spacing:.08em; text-transform:uppercase; display:block; margin-bottom:5px; }
input[type=text], input[type=number], input[type=date], select { width:100%; background:#0f1117; border:1px solid #2a2a45; border-radius:12px; padding:11px 14px; color:#e0d8ff; font-size:14px; font-family:inherit; outline:none; transition:border .2s; }
input:focus, select:focus { border-color:#7c6aff; }
input::placeholder { color:#3a3a5a; }
select option { background:#1a1a2e; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; }
.time-row { display:flex; gap:6px; align-items:center; }
.time-row input[type=number] { text-align:center; }
.time-sep { color:#5a5a7a; font-size:18px; font-weight:700; flex-shrink:0; }
.repeat-row { display:flex; gap:8px; align-items:center; }
.repeat-row input[type=number] { width:70px; flex:none; }
.repeat-row select { flex:1; }
.btn-row { display:flex; gap:8px; margin-top:4px; }
.add-btn { flex:1; padding:12px; background:linear-gradient(135deg,#7c6aff,#b06aff); border:none; border-radius:12px; color:white; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:opacity .2s; }
.add-btn:hover { opacity:.85; }
.cancel-btn { padding:12px 16px; background:#2a2a45; border:none; border-radius:12px; color:#7c6aff; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:opacity .2s; display:none; }
.cancel-btn:hover { opacity:.85; }
.section-label { font-size:11px; color:#4a4a6a; letter-spacing:.1em; text-transform:uppercase; margin-bottom:10px; }
.reminders { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.reminder-card { background:#1a1a2e; border:1px solid #2a2a45; border-radius:16px; padding:14px 16px; display:flex; align-items:center; gap:10px; transition:all .3s; }
.reminder-card.ringing { border-color:#ff9a7a; background:#2a1a1a; animation:ring-pulse .5s ease-in-out infinite alternate; }
.reminder-card.done { opacity:.4; }
@keyframes ring-pulse { from{box-shadow:0 0 0 0 rgba(255,154,122,.3)} to{box-shadow:0 0 0 8px rgba(255,154,122,0)} }
.r-icon { font-size:22px; flex-shrink:0; width:34px; text-align:center; }
.r-info { flex:1; min-width:0; }
.r-title { font-size:14px; font-weight:600; color:#e0d8ff; margin-bottom:3px; word-break:break-word; line-height:1.4; }
.r-meta { font-size:11px; color:#5a5a7a; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.badge { background:#2a2a45; border-radius:6px; padding:2px 7px; font-size:10px; color:#7c6aff; white-space:nowrap; }
.badge.daily { color:#6ddfaa; background:#1a2a2a; }
.badge.once { color:#ffb86a; background:#2a1f10; }
.badge.interval { color:#6ab8ff; background:#101e2a; }
.time-left { font-size:12px; font-weight:700; color:#7c6aff; flex-shrink:0; text-align:right; min-width:44px; }
.time-left.soon { color:#ff9a7a; }
.card-actions { display:flex; gap:2px; flex-shrink:0; }
.edit-btn { background:none; border:none; color:#3a3a5a; cursor:pointer; font-size:14px; padding:4px 6px; transition:color .2s; }
.edit-btn:hover { color:#7c6aff; }
.delete-btn { background:none; border:none; color:#3a3a5a; cursor:pointer; font-size:14px; padding:4px 6px; transition:color .2s; }
.delete-btn:hover { color:#ff6a6a; }
.popup-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
.popup-overlay.show { display:flex; }
.popup { background:#1a1a2e; border:1px solid #7c6aff44; border-radius:24px; padding:32px 28px; max-width:440px; width:90%; text-align:center; animation:popup-in .3s cubic-bezier(.34,1.56,.64,1); }
@keyframes popup-in { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.popup-emoji { font-size:48px; margin-bottom:12px; }
.popup-title { font-size:11px; color:#7c6aff; letter-spacing:.1em; text-transform:uppercase; margin-bottom:8px; }
.popup-task { font-size:18px; font-weight:700; color:#f0eaff; margin-bottom:6px; line-height:1.4; word-break:break-word; }
.popup-time { font-size:13px; color:#5a5a7a; margin-bottom:24px; }
.popup-dismiss { background:linear-gradient(135deg,#7c6aff,#b06aff); border:none; border-radius:12px; padding:12px 32px; color:white; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; width:100%; }
.empty { text-align:center; padding:32px; color:#3a3a5a; font-size:13px; }
.empty-icon { font-size:32px; margin-bottom:8px; }
.repeat-detail { display:none; }
.repeat-detail.show { display:block; }
.emoji-field { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
.emoji-preview { font-size:26px; width:48px; height:48px; background:#0f1117; border:1px solid #2a2a45; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:border .2s; user-select:none; }
.emoji-preview:hover { border-color:#7c6aff; }
.emoji-label { font-size:11px; color:#5a5a7a; letter-spacing:.08em; text-transform:uppercase; }
.emoji-picker-wrap { position:relative; }
.emoji-picker-box { position:absolute; top:56px; left:0; z-index:200; background:#1a1a2e; border:1px solid #2a2a45; border-radius:16px; padding:12px; box-shadow:0 8px 32px rgba(0,0,0,.6); width:290px; }
.emoji-picker-box.hidden { display:none; }
.emoji-cats { display:flex; gap:5px; margin-bottom:8px; flex-wrap:wrap; }
.emoji-cat-btn { background:#0f1117; border:1px solid #2a2a45; border-radius:8px; padding:3px 8px; font-size:11px; color:#7c6aff; cursor:pointer; transition:all .15s; }
.emoji-cat-btn.active { background:#7c6aff22; border-color:#7c6aff; }
.emoji-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:3px; max-height:150px; overflow-y:auto; }
.emoji-btn { background:none; border:none; font-size:20px; cursor:pointer; padding:4px; border-radius:8px; transition:background .15s; }
.emoji-btn:hover { background:#2a2a45; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🌸 Nhắc việc</h1>
    <div class="now" id="now-time"></div>
  </div>

  <div class="add-box" id="add-box">
    <div class="form-title" id="form-title">+ Thêm nhắc việc mới</div>
    <div class="emoji-field">
      <div class="emoji-picker-wrap">
        <div class="emoji-preview" id="emoji-preview" onclick="togglePicker()">🌸</div>
        <div class="emoji-picker-box hidden" id="emoji-picker">
          <div class="emoji-cats" id="emoji-cats"></div>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
      </div>
      <div>
        <div class="emoji-label">Icon</div>
        <div style="font-size:12px;color:#3a3a5a;margin-top:2px">Nhấn để chọn</div>
      </div>
    </div>
    <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">
        <label style="margin-bottom:0">Tên việc</label>
        <span id="char-count" style="font-size:11px;color:#3a3a5a">0 / 300</span>
      </div>
      <input type="text" id="task-input" placeholder="Ví dụ: Uống nước 💧" maxlength="300" oninput="document.getElementById('char-count').textContent=this.value.length+' / 300';document.getElementById('char-count').style.color=this.value.length>270?'#ff9a7a':'#3a3a5a'">
    </div>
    <div class="field">
      <label>Giờ nhắc</label>
      <div class="time-row">
        <input type="number" id="hour-input" min="0" max="23" placeholder="GIỜ">
        <span class="time-sep">:</span>
        <input type="number" id="min-input" min="0" max="59" placeholder="PHÚT">
      </div>
    </div>
    <div class="field">
      <label>Kiểu nhắc</label>
      <select id="repeat-type" onchange="onRepeatChange()">
        <option value="once">1 lần duy nhất</option>
        <option value="daily">Hằng ngày</option>
        <option value="fixed">Ngày cố định</option>
        <option value="interval_min">Lặp theo phút</option>
        <option value="interval_hour">Lặp theo giờ</option>
        <option value="interval_day">Lặp theo ngày</option>
        <option value="monthly">Hằng tháng</option>
        <option value="yearly">Hằng năm</option>
      </select>
    </div>
    <div class="field repeat-detail" id="detail-fixed">
      <label>Chọn ngày</label>
      <input type="date" id="fixed-date">
    </div>
    <div class="field repeat-detail" id="detail-interval-min">
      <label>Mỗi bao nhiêu phút?</label>
      <div class="repeat-row">
        <input type="number" id="interval-min-val" min="1" max="1440" value="30">
        <select id="interval-min-unit" style="flex:0;width:auto;">
          <option value="min">phút</option>
          <option value="sec">giây</option>
        </select>
      </div>
    </div>
    <div class="field repeat-detail" id="detail-interval-hour">
      <label>Mỗi bao nhiêu giờ?</label>
      <input type="number" id="interval-hour-val" min="1" max="24" value="2">
    </div>
    <div class="field repeat-detail" id="detail-interval-day">
      <label>Mỗi bao nhiêu ngày?</label>
      <input type="number" id="interval-day-val" min="1" max="365" value="1">
    </div>
    <div class="field repeat-detail" id="detail-monthly">
      <label>Ngày nào trong tháng?</label>
      <input type="number" id="monthly-day" min="1" max="31" value="1">
    </div>
    <div class="field repeat-detail" id="detail-yearly">
      <label>Chọn ngày/tháng</label>
      <div class="row2">
        <div><label style="font-size:10px;">Ngày</label><input type="number" id="yearly-day" min="1" max="31" value="1"></div>
        <div><label style="font-size:10px;">Tháng</label><input type="number" id="yearly-month" min="1" max="12" value="1"></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="add-btn" id="add-btn" onclick="addReminder()">Thêm</button>
      <button class="cancel-btn" id="cancel-btn" onclick="cancelEdit()">Hủy</button>
    </div>
  </div>

  <div class="section-label">Những việc sắp tới</div>
  <div class="reminders" id="reminders-list"></div>
</div>

<div class="popup-overlay" id="popup">
  <div class="popup">
    <div class="popup-emoji" id="popup-emoji">🔔</div>
    <div class="popup-title">Nhắc việc</div>
    <div class="popup-task" id="popup-task">Uống nước</div>
    <div class="popup-time" id="popup-time">⏰ 12:00</div>
    <button class="popup-dismiss" onclick="dismissPopup()">Đã xong!</button>
  </div>
</div>

<script>
let reminders=[],editingId=null,activePopup=null,checked={};const emojiCats={activity:['⚽','🏀','🎾','🎿','⛹️','🏌️','🚴','🏊','🤸','🧘'],animals:['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯'],food:['🍎','🍊','🍋','🍌','🍉','🍇','🍓','🍈','🍒','🍑'],objects:['⌚','💻','📱','⌨️','🖥️','🖨️','📞','☎️','📟','📠'],nature:['🌲','🌳','🌴','🌵','🌾','🌿','☘️','🍀','🎍','🎎'],people:['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊']};let selectedEmojiCat='activity',emojiByCat=null;function initEmoji(){emojiByCat=Object.entries(emojiCats);const cats=document.getElementById('emoji-cats');cats.innerHTML=emojiByCat.map(([k,v],i)=>`<button class="emoji-cat-btn ${i===0?'active':''}" onclick="switchEmojiCat('${k}')">${v[0]}</button>`).join('');}function switchEmojiCat(cat){selectedEmojiCat=cat;const btns=document.querySelectorAll('.emoji-cat-btn');btns.forEach(b=>b.classList.remove('active'));event.target.classList.add('active');updateEmojiGrid();}function updateEmojiGrid(){const grid=document.getElementById('emoji-grid');const emojis=emojiCats[selectedEmojiCat]||[];grid.innerHTML=emojis.map(e=>`<button class="emoji-btn" onclick="selectEmoji('${e}')">${e}</button>`).join('');}function togglePicker(){document.getElementById('emoji-picker').classList.toggle('hidden');}function selectEmoji(e){document.getElementById('emoji-preview').textContent=e;document.getElementById('emoji-picker').classList.add('hidden');}function onRepeatChange(){const t=document.getElementById('repeat-type').value;document.querySelectorAll('.repeat-detail').forEach(el=>el.classList.remove('show'));if(t==='fixed')document.getElementById('detail-fixed').classList.add('show');else if(t==='interval_min')document.getElementById('detail-interval-min').classList.add('show');else if(t==='interval_hour')document.getElementById('detail-interval-hour').classList.add('show');else if(t==='interval_day')document.getElementById('detail-interval-day').classList.add('show');else if(t==='monthly')document.getElementById('detail-monthly').classList.add('show');else if(t==='yearly')document.getElementById('detail-yearly').classList.add('show');}const pad=n=>String(n).padStart(2,'0');function addReminder(){const e=document.getElementById('emoji-preview').textContent;const t=document.getElementById('task-input').value.trim();const h=parseInt(document.getElementById('hour-input').value)||0;const m=parseInt(document.getElementById('min-input').value)||0;const type=document.getElementById('repeat-type').value;if(!t){alert('Nhập tên việc nha chế!');return;}if(h<0||h>23||m<0||m>59){alert('Giờ phút không hợp lệ!');return;}const time=pad(h)+':'+pad(m);const reminder={id:Date.now(),emoji:e,task:t,time:time,type:type,done:false};if(type==='fixed')reminder.fixedDate=document.getElementById('fixed-date').value;else if(type==='interval_min')reminder.intervalMin=parseInt(document.getElementById('interval-min-val').value)||30;else if(type==='interval_hour')reminder.intervalHour=parseInt(document.getElementById('interval-hour-val').value)||2;else if(type==='interval_day')reminder.intervalDay=parseInt(document.getElementById('interval-day-val').value)||1;else if(type==='monthly')reminder.monthlyDay=parseInt(document.getElementById('monthly-day').value)||1;else if(type==='yearly'){reminder.yearlyDay=parseInt(document.getElementById('yearly-day').value)||1;reminder.yearlyMonth=parseInt(document.getElementById('yearly-month').value)||1;}if(editingId){reminders=reminders.map(r=>r.id===editingId?{...r,...reminder}:r);editingId=null;}else{reminders.push(reminder);}document.getElementById('task-input').value='';document.getElementById('hour-input').value='';document.getElementById('min-input').value='';document.getElementById('repeat-type').value='once';document.getElementById('emoji-preview').textContent='🌸';onRepeatChange();document.getElementById('add-box').classList.remove('editing');document.getElementById('form-title').textContent='+ Thêm nhắc việc mới';document.getElementById('add-btn').textContent='Thêm';document.getElementById('cancel-btn').style.display='none';save();render();}function editReminder(id){const r=reminders.find(x=>x.id===id);if(!r)return;editingId=id;document.getElementById('emoji-preview').textContent=r.emoji;document.getElementById('task-input').value=r.task;const [h,m]=r.time.split(':').map(Number);document.getElementById('hour-input').value=h;document.getElementById('min-input').value=m;document.getElementById('repeat-type').value=r.type;if(r.type==='fixed')document.getElementById('fixed-date').value=r.fixedDate;else if(r.type==='interval_min')document.getElementById('interval-min-val').value=r.intervalMin||30;else if(r.type==='interval_hour')document.getElementById('interval-hour-val').value=r.intervalHour||2;else if(r.type==='interval_day')document.getElementById('interval-day-val').value=r.intervalDay||1;else if(r.type==='monthly')document.getElementById('monthly-day').value=r.monthlyDay||1;else if(r.type==='yearly'){document.getElementById('yearly-day').value=r.yearlyDay||1;document.getElementById('yearly-month').value=r.yearlyMonth||1;}onRepeatChange();document.getElementById('add-box').classList.add('editing');document.getElementById('form-title').textContent='✏️ Chỉnh sửa nhắc việc';document.getElementById('add-btn').textContent='Cập nhật';document.getElementById('cancel-btn').style.display='inline-block';}function cancelEdit(){editingId=null;document.getElementById('task-input').value='';document.getElementById('hour-input').value='';document.getElementById('min-input').value='';document.getElementById('repeat-type').value='once';document.getElementById('emoji-preview').textContent='🌸';onRepeatChange();document.getElementById('add-box').classList.remove('editing');document.getElementById('form-title').textContent='+ Thêm nhắc việc mới';document.getElementById('add-btn').textContent='Thêm';document.getElementById('cancel-btn').style.display='none';}function deleteReminder(id){reminders=reminders.filter(r=>r.id!==id);if(editingId===id)cancelEdit();save();render();}function save(){localStorage.setItem('reminders_v3',JSON.stringify(reminders));if('caches' in window){caches.open('reminder-sw-v1').then(cache=>{cache.put('/reminder-data',new Response(JSON.stringify(reminders),{headers:{'Content-Type':'application/json'}}));});}}function getBadge(r){const map={once:'1 lần',daily:'Hằng ngày',fixed:'Ngày cố định',interval_min:`Mỗi ${r.intervalMin||30}p`,interval_hour:`Mỗi ${r.intervalHour||2}g`,interval_day:`Mỗi ${r.intervalDay||1} ngày`,monthly:`Ngày ${r.monthlyDay} hàng tháng`,yearly:`Ngày ${r.yearlyDay}/${r.yearlyMonth} hàng năm`};const cls={once:'once',daily:'daily',fixed:'once',interval_min:'interval',interval_hour:'interval',interval_day:'interval',monthly:'daily',yearly:'daily'};return `<span class="badge ${cls[r.type]||''}">${map[r.type]||r.type}</span>`;}function shouldFireToday(r){const now=new Date();if(r.type==='once'||r.type==='daily')return true;if(r.type==='fixed')return new Date(r.fixedDate).toDateString()===now.toDateString();if(r.type==='monthly')return now.getDate()===r.monthlyDay;if(r.type==='yearly')return now.getDate()===r.yearlyDay&&now.getMonth()+1===r.yearlyMonth;if(r.type==='interval_day'){const diff=Math.floor((now-new Date(r.id))/86400000);return diff%(r.intervalDay||1)===0;}return true;}function getTimeLeft(r){const now=new Date();if(r.type==='interval_min'){const interval=(r.intervalMin||30)*60000;const ms=interval-(now-new Date(r.id))%interval;const mins=Math.floor(ms/60000);if(mins<1)return{text:'🔔 Ngay!',soon:true,ringing:true};return{text:`${mins}p`,soon:mins<=5,ringing:false};}if(r.type==='interval_hour'){const interval=(r.intervalHour||2)*3600000;const ms=interval-(now-new Date(r.id))%interval;const mins=Math.floor(ms/60000);if(mins<1)return{text:'🔔 Ngay!',soon:true,ringing:true};if(mins<60)return{text:`${mins}p`,soon:mins<=10,ringing:false};return{text:`${Math.floor(mins/60)}g${mins%60>0?mins%60+'p':''}`,soon:false,ringing:false};}const [h,m]=r.time.split(':').map(Number);const target=new Date(now);target.setHours(h,m,0,0);if(target<=now)target.setDate(target.getDate()+1);const ms=target-now;const mins=Math.floor(ms/60000);if(mins<1)return{text:'🔔 Ngay!',soon:true,ringing:true};if(mins<60)return{text:`${mins}p`,soon:mins<=10,ringing:false};return{text:`${Math.floor(mins/60)}g${mins%60>0?mins%60+'p':''}`,soon:false,ringing:false};}function render(){const list=document.getElementById('reminders-list');if(!reminders.length){list.innerHTML='<div class="empty"><div class="empty-icon">📭</div>Chưa có việc gì nha chế!</div>';return;}list.innerHTML=[...reminders].sort((a,b)=>a.time.localeCompare(b.time)).map(r=>{const tl=getTimeLeft(r);const ringing=tl.ringing&&!r.done;const isDone=r.done&&r.type==='once';const isEditing=editingId===r.id;return `<div class="reminder-card ${ringing?'ringing':''} ${isDone?'done':''}" style="${isEditing?'border-color:#7c6aff':''}"><div class="r-icon">${r.emoji}</div><div class="r-info"><div class="r-title">${r.task}</div><div class="r-meta">${r.time} ${getBadge(r)}</div></div><div class="time-left ${tl.soon?'soon':''}">${isDone?'✓':tl.text}</div><div class="card-actions"><button class="edit-btn" onclick="editReminder(${r.id})" title="Chỉnh sửa">✏️</button><button class="delete-btn" onclick="deleteReminder(${r.id})" title="Xoá">✕</button></div></div>`;}).join('');}function showPopup(r){if(activePopup===r.id)return;activePopup=r.id;document.getElementById('popup-emoji').textContent=r.emoji;document.getElementById('popup-task').textContent=r.task;document.getElementById('popup-time').textContent='⏰ '+r.time;document.getElementById('popup').classList.add('show');try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.15,.3].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.3,ctx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d+.2);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.2);});}catch(e){}}function dismissPopup(){document.getElementById('popup').classList.remove('show');if(activePopup){reminders=reminders.map(r=>r.id===activePopup&&r.type==='once'?{...r,done:true}:r);save();}activePopup=null;render();}function updateClock(){const now=new Date();document.getElementById('now-time').textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());}if('Notification' in window&&Notification.permission==='default'){Notification.requestPermission();}if('serviceWorker' in navigator){navigator.serviceWorker.register('/Widget/sw.js',{scope:'/Widget/'}).then(reg=>{console.log('SW registered');navigator.serviceWorker.ready.then(r=>{r.active&&r.active.postMessage({type:'SCHEDULE'});});});navigator.serviceWorker.addEventListener('message',e=>{if(e.data.type==='CHECK')checkReminders();});}function fireNotification(r){showPopup(r);if('Notification' in window&&Notification.permission==='granted'){const n=new Notification('🔔 Nhắc việc!',{body:r.emoji+' '+r.task,icon:'https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/72x72/1f514.png',requireInteraction:true});n.onclick=()=>{window.focus();n.close()};}}function checkReminders(){const now=new Date();const cur=pad(now.getHours())+':'+pad(now.getMinutes());reminders.forEach(r=>{if(r.done&&r.type==='once')return;let fire=false;if(r.type==='interval_min'||r.type==='interval_hour'){if(getTimeLeft(r).ringing)fire=true;}else if(shouldFireToday(r)&&r.time===cur)fire=true;if(fire){const key=r.id+'-'+cur+'-'+now.toDateString();if(!checked[key]){checked[key]=true;fireNotification(r);}}});}reminders=JSON.parse(localStorage.getItem('reminders_v3')||'[]');initEmoji();updateEmojiGrid();render();updateClock();setInterval(()=>{updateClock();checkReminders();render();},1000);
</script>
